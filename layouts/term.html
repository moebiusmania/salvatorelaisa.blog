{{- define "main" }}
{{- /* /tags/<tag>/: published posts with a given tag. */}}
{{- $results := .Pages.ByDate.Reverse }}
<div class="tag-page">
  <p>
    {{ len $results }} articoli trovati con il tag
  </p>
  <h1>{{ .Data.Term }}</h1>
  {{ partial "components/PostsList.html" (dict "posts" $results) }}
</div>
{{- end }}
