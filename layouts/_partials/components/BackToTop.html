<button
  x-data="backToTop"
  x-show="visible"
  x-transition:enter="back-to-top-enter-active"
  x-transition:enter-start="back-to-top-enter-from"
  x-transition:enter-end="back-to-top-enter-to"
  x-transition:leave="back-to-top-leave-active"
  x-transition:leave-start="back-to-top-leave-from"
  x-transition:leave-end="back-to-top-leave-to"
  style="display: none"
  type="button"
  class="back-to-top"
  title="Torna su"
  aria-label="Torna su"
  @click="scrollToTop"
>
  <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none"
    stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
    <path d="M12 19V5" />
    <path d="m5 12 7-7 7 7" />
  </svg>
  <span>Torna su</span>
</button>
