{{- /* Random, organic-looking clouds. Values are computed once at build time, so
  each build bakes a fixed set. Context: optional count. */ -}}
<div class="clouds" role="presentation" aria-label="Decorative drifting clouds animation">
  {{- range seq (. | default 8) }}
  {{- $duration := add 45 (mul (math.Rand) 45) }}
  <div class="cloud" role="presentation" aria-hidden="true" style="{{ printf "--top:%.1f%%;--duration:%.1fs;--delay:%.1fs;--scale:%.2f;" (add 2 (mul (math.Rand) 93)) $duration (mul -1 (mul (math.Rand) $duration)) (add 0.6 (mul (math.Rand) 0.6)) | safeCSS }}"></div>
  {{- end }}
</div>
