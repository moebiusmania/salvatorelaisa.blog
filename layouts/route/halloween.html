{{- define "main" }}
{{- $entry := hugo.Data.gen.pages.halloween }}
<article class="content halloween-page">
  <h1>{{ $entry.title }}</h1>
  <div>{{ partial "markdown.html" (dict "page" . "source" $entry.body) }}</div>

  {{- range $entry.sections }}
  {{ partial "components/HalloweenSection.html" . }}
  {{- end }}

  <hr />
</article>
{{ partial "components/Tip.html" }}
{{- end }}
