# Wrap up Spooktober every year: switch the site back to the default theme, commit
# the changes on main and trigger a deploy. The spooktober-reloaded post stays published

name: Spooktober end

on:
  schedule:
    # GitHub cron runs in UTC: 21:00 UTC on Nov 2 is 22:00 Europe/Rome (always CET
    # by then, DST ends on the last Sunday of October).
    - cron: "0 21 2 11 *"
  # Manual fallback, in case the scheduled run is delayed or skipped
  workflow_dispatch:

permissions:
  contents: write
  actions: write

concurrency:
  group: spooktober-end
  cancel-in-progress: false

jobs:
  restore-default:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6
        with:
          ref: main

      - name: 💻 Use Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json

      - name: 📦 Install dependencies
        run: bun install --frozen-lockfile

      - name: 🧹 Restore default theme
        run: |
          sed -i -E 's/^export const CURRENT_THEME = "[a-z]+" as SeasonTheme;$/export const CURRENT_THEME = "default" as SeasonTheme;/' src/utils/config.ts

          # Fail loudly if the file drifted and the replacement did not apply
          grep -qx 'export const CURRENT_THEME = "default" as SeasonTheme;' src/utils/config.ts

      - name: 📝 Run tests
        run: bun test

      - name: 💾 Commit & push on main
        id: commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/utils/config.ts

          if git diff --cached --quiet; then
            echo "Nothing to commit, default theme already enabled"
            echo "pushed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          git commit -m "chore: restore default theme after spooktober"
          git push origin HEAD:main
          echo "pushed=true" >> "$GITHUB_OUTPUT"

      # Pushes made with GITHUB_TOKEN do not trigger other workflows,
      # so the deploy has to be dispatched explicitly
      - name: 🚀 Trigger deploy
        if: steps.commit.outputs.pushed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run deploy.yml --ref main
