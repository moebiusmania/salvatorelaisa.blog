# Wrap up Spooktober every year: switch the site back to the default theme, commit
# the changes on main and trigger a deploy. The spooktober-reloaded post stays published

name: Spooktober end

on:
  schedule:
    # GitHub cron runs in UTC: 21:00 UTC on Nov 2 is 22:00 Europe/Rome (always CET
    # by then, DST ends on the last Sunday of October).
    - cron: "0 21 2 11 *"
  # Manual fallback, in case the scheduled run is delayed or skipped
  workflow_dispatch:

permissions:
  contents: write
  actions: write

concurrency:
  group: spooktober-end
  cancel-in-progress: false

jobs:
  restore-default:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6
        with:
          ref: main

      - name: 💻 Use Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          # Also caches the compiled Hugo (pinned in tools/hugo/go.mod).
          cache-dependency-path: |
            go.sum
            tools/hugo/go.sum

      - name: 🧹 Restore default theme
        run: |
          sed -i -E 's/^currentTheme = "[a-z]+"$/currentTheme = "default"/' hugo.toml

          # Fail loudly if the file drifted and the replacement did not apply
          grep -qx 'currentTheme = "default"' hugo.toml

      - name: 📝 Run tests
        # -count=1: never trust cached results, the build test runs Hugo, whose
        # inputs (layouts, routes, assets, data) the Go test cache cannot see.
        run: go test -count=1 ./...

      - name: 💾 Commit & push on main
        id: commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add hugo.toml

          if git diff --cached --quiet; then
            echo "Nothing to commit, default theme already enabled"
            echo "pushed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          git commit -m "chore: restore default theme after spooktober"
          git push origin HEAD:main
          echo "pushed=true" >> "$GITHUB_OUTPUT"

      # Pushes made with GITHUB_TOKEN do not trigger other workflows,
      # so the deploy has to be dispatched explicitly
      - name: 🚀 Trigger deploy
        if: steps.commit.outputs.pushed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run deploy.yml --ref main
