# Wrap up Spooktober 2026: switch the site back to the default theme, commit the
# changes on main and trigger a deploy. The spooktober-reloaded post stays published

name: Spooktober 2026 end

on:
  schedule:
    # GitHub cron runs in UTC: 23:01 UTC on Nov 1 is 00:01 Europe/Rome (CET) on Nov 2.
    # Cron has no year field, the `guard` job below prevents runs in later years.
    - cron: "1 23 1 11 *"
  # Manual fallback, in case the scheduled run is delayed or skipped
  workflow_dispatch:

permissions:
  contents: write
  actions: write

concurrency:
  group: spooktober-2026-end
  cancel-in-progress: false

jobs:
  guard:
    runs-on: ubuntu-latest
    outputs:
      run: ${{ steps.check.outputs.run }}

    steps:
      - name: 📅 Check the year
        id: check
        run: |
          if [ "${{ github.event_name }}" = "schedule" ] && [ "$(TZ=Europe/Rome date +%Y)" != "2026" ]; then
            echo "run=false" >> "$GITHUB_OUTPUT"
          else
            echo "run=true" >> "$GITHUB_OUTPUT"
          fi

  restore-default:
    needs: guard
    if: needs.guard.outputs.run == 'true'
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6
        with:
          ref: main

      - name: 💻 Use Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          # Also caches the compiled Hugo (pinned in tools/hugo/go.mod).
          cache-dependency-path: |
            go.sum
            tools/hugo/go.sum

      - name: 🧹 Restore default theme
        run: |
          sed -i -E 's/^currentTheme = "[a-z]+"$/currentTheme = "default"/' hugo.toml

          # Fail loudly if the file drifted and the replacement did not apply
          grep -qx 'currentTheme = "default"' hugo.toml

      - name: 📝 Run tests
        # -count=1: never trust cached results, the build test runs Hugo, whose
        # inputs (layouts, routes, assets, data) the Go test cache cannot see.
        run: go test -count=1 ./...

      - name: 💾 Commit & push on main
        id: commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add hugo.toml

          if git diff --cached --quiet; then
            echo "Nothing to commit, default theme already enabled"
            echo "pushed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          git commit -m "chore: restore default theme after spooktober"
          git push origin HEAD:main
          echo "pushed=true" >> "$GITHUB_OUTPUT"

      # Pushes made with GITHUB_TOKEN do not trigger other workflows,
      # so the deploy has to be dispatched explicitly
      - name: 🚀 Trigger deploy
        if: steps.commit.outputs.pushed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run deploy.yml --ref main
