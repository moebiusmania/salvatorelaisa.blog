# Build the website to produce the static files & deploy them to GH pages

name: Build & deploy

on:
  push:
    branches: [main]
  # Allows other workflows (e.g. scheduled ones) to trigger a deploy
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - name: 💻 Use Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json

      - name: 📦 Install dependencies
        run: bun install --frozen-lockfile

      # Fonts are committed in public/fonts/: only hit the network when a
      # family declared in fonts.yaml has no local files yet.
      - name: 🔤 Download fonts (if missing)
        run: |
          missing=0
          [ -s public/fonts/fonts.css ] || missing=1
          while IFS= read -r family; do
            slug=$(printf '%s' "$family" | tr '[:upper:]' '[:lower:]' | sed -E 's/[^a-z0-9]+/-/g; s/^-+|-+$//g')
            if ! ls public/fonts/"$slug"/*.woff2 >/dev/null 2>&1; then
              echo "Missing font files for $family"
              missing=1
            fi
          done < <(grep -oP 'name:\s*"\K[^"]+' fonts.yaml)
          if [ "$missing" -eq 1 ]; then
            bun run fonts:download
          else
            echo "Fonts already committed, skipping download"
          fi

      - name: 📝 Run tests
        run: bun test

      - name: 🏗️ Build static website
        run: bun run build

      - name: 🚀 Upload artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: _site

  # A separate job, as in GitHub's Pages starter: deploy-pages looks the artifact
  # up through the API, which may not list it yet right after an upload in the
  # same job. A failed deploy can also be re-run alone, without uploading a
  # second "github-pages" artifact to the same run (which deploy-pages rejects).
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.gh-pages.outputs.page_url }}

    steps:
      - name: 🏁 Deploy to GitHub Pages
        id: gh-pages
        uses: actions/deploy-pages@v5
