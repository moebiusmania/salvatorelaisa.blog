# Build the website to produce the static files & deploy them to GH pages

name: Build & deploy

on:
  push:
    branches: [main]
  # Allows other workflows (e.g. scheduled ones) to trigger a deploy
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6

      - name: 💻 Use Deno v2
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x # Run with latest stable Deno.
          cache: true

      # Fonts are committed in public/fonts/: only hit the network when a
      # family declared in fonts.config.ts has no local files yet.
      - name: 🔤 Download fonts (if missing)
        run: |
          missing=0
          [ -s public/fonts/fonts.css ] || missing=1
          while IFS= read -r family; do
            slug=$(printf '%s' "$family" | tr '[:upper:]' '[:lower:]' | sed -E 's/[^a-z0-9]+/-/g; s/^-+|-+$//g')
            if ! ls public/fonts/"$slug"/*.woff2 >/dev/null 2>&1; then
              echo "Missing font files for $family"
              missing=1
            fi
          done < <(grep -oP 'name:\s*"\K[^"]+' fonts.config.ts)
          if [ "$missing" -eq 1 ]; then
            deno task fonts:download
          else
            echo "Fonts already committed, skipping download"
          fi

      - name: 📝 Run tests
        run: deno task test

      - name: 🏗️ Build static website
        run: deno task build

      - name: 🚀 Upload artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: _site

      - name: 🏁 Deploy to GitHub Pages
        id: gh-pages
        uses: actions/deploy-pages@v5
