# Kick off Spooktober every year: switch the site to the halloween theme, publish
# the related post, commit the changes on main and trigger a deploy

name: Spooktober

on:
  schedule:
    # GitHub cron runs in UTC: 22:01 UTC on Sep 30 is 00:01 Europe/Rome (CEST) on Oct 1.
    - cron: "1 22 30 9 *"
  # Manual fallback, in case the scheduled run is delayed or skipped
  workflow_dispatch:

permissions:
  contents: write
  actions: write

concurrency:
  group: spooktober
  cancel-in-progress: false

jobs:
  enable-halloween:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6
        with:
          ref: main

      - name: 💻 Use Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json

      - name: 📦 Install dependencies
        run: bun install --frozen-lockfile

      - name: 🎃 Set halloween theme & publish post
        run: |
          sed -i -E 's/^export const CURRENT_THEME = "[a-z]+" as SeasonTheme;$/export const CURRENT_THEME = "halloween" as SeasonTheme;/' src/utils/config.ts
          sed -i -E '0,/^draft: (true|false)$/s//draft: false/' content/spooktober-reloaded.md

          # Fail loudly if the files drifted and the replacements did not apply
          grep -qx 'export const CURRENT_THEME = "halloween" as SeasonTheme;' src/utils/config.ts
          grep -qx 'draft: false' content/spooktober-reloaded.md

      - name: 📝 Run tests
        run: bun test

      - name: 💾 Commit & push on main
        id: commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/utils/config.ts content/spooktober-reloaded.md

          if git diff --cached --quiet; then
            echo "Nothing to commit, halloween theme already enabled"
            echo "pushed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          git commit -m "chore: enable halloween theme and publish spooktober-reloaded"
          git push origin HEAD:main
          echo "pushed=true" >> "$GITHUB_OUTPUT"

      # Pushes made with GITHUB_TOKEN do not trigger other workflows,
      # so the deploy has to be dispatched explicitly
      - name: 🚀 Trigger deploy
        if: steps.commit.outputs.pushed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run deploy.yml --ref main
