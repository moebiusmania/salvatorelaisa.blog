# Kick off Spooktober every year: switch the site to the halloween theme, publish
# the related post, commit the changes on main and trigger a deploy

name: Spooktober

on:
  schedule:
    # GitHub cron runs in UTC: 22:01 UTC on Sep 30 is 00:01 Europe/Rome (CEST) on Oct 1.
    - cron: "1 22 30 9 *"
  # Manual fallback, in case the scheduled run is delayed or skipped
  workflow_dispatch:

permissions:
  contents: write
  actions: write

concurrency:
  group: spooktober
  cancel-in-progress: false

jobs:
  enable-halloween:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6
        with:
          ref: main

      - name: 💻 Use Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          # Also caches the compiled Hugo (pinned in tools/hugo/go.mod).
          cache-dependency-path: |
            go.sum
            tools/hugo/go.sum

      - name: 🎃 Set halloween theme & publish post
        run: |
          sed -i -E 's/^currentTheme = "[a-z]+"$/currentTheme = "halloween"/' hugo.toml
          sed -i -E '0,/^draft: (true|false)$/s//draft: false/' content/spooktober-reloaded.md

          # Fail loudly if the files drifted and the replacements did not apply
          grep -qx 'currentTheme = "halloween"' hugo.toml
          grep -qx 'draft: false' content/spooktober-reloaded.md

      - name: 📝 Run tests
        # -count=1: never trust cached results, the build test runs Hugo, whose
        # inputs (layouts, routes, assets, data) the Go test cache cannot see.
        run: go test -count=1 ./...

      - name: 💾 Commit & push on main
        id: commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add hugo.toml content/spooktober-reloaded.md

          if git diff --cached --quiet; then
            echo "Nothing to commit, halloween theme already enabled"
            echo "pushed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          git commit -m "chore: enable halloween theme and publish spooktober-reloaded"
          git push origin HEAD:main
          echo "pushed=true" >> "$GITHUB_OUTPUT"

      # Pushes made with GITHUB_TOKEN do not trigger other workflows,
      # so the deploy has to be dispatched explicitly
      - name: 🚀 Trigger deploy
        if: steps.commit.outputs.pushed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run deploy.yml --ref main
